name: Keep Supabase Alive

# 每天 03:00 UTC 写一次心跳。免费版按「过去 7 天里有没有真正打到 Postgres 的用户请求」判断是否暂停，
# 需要每天都有写入，不能只靠一周两次的池化只读。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {} # 也支持在 GitHub Actions 页面手动点一下立即触发，方便测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat through Supabase REST
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "缺少 GitHub secret SUPABASE_ANON_KEY。请填入该项目的 anon public key 或 publishable key，不要使用 service_role。" >&2
            exit 1
          fi

          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # PostgREST 把 timestamptz 序列化成 +00:00，而不是请求里的 Z。两种都是这次写入的 UTC 时刻。
          STAMP_OFFSET="${STAMP%Z}+00:00"
          # PostgREST 在项目内部执行 UPDATE，不经过外部 Supavisor，也不经过网站的 Prisma 连接池。
          BODY=$(curl -sS -f -X PATCH \
            "${SUPABASE_URL}/rest/v1/KeepAlive?id=eq.1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"pingedAt\":\"${STAMP}\"}")

          printf '%s\n' "$BODY"
          case "$BODY" in
            *"$STAMP"*|*"$STAMP_OFFSET"*) echo "Keep-alive heartbeat 已写入 ${STAMP}" ;;
            *) echo "心跳响应里没有刚写入的时间戳，数据库写入未确认" >&2; exit 1 ;;
          esac
        env:
          SUPABASE_URL: https://sfzpmztijkgfjogfsylp.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
